function genRef(){
  const ts  = Date.now().toString(36).toUpperCase();
  const rnd = Math.random().toString(36).substring(2,5).toUpperCase();
  return `TKT-${ts}-${rnd}`;
}

/* ═══════════════════════════════════════════════════════
   WHATSAPP & EMAIL URL BUILDERS
   ═══════════════════════════════════════════════════════ */
function buildWA(f, svcId, ref=""){
  const svc     = SVCLIST.find(s=>s.id===svcId)?.label || svcId;
  const refLine = ref ? `*Ticket Ref:* ${ref}\n` : "";
  if(svcId==="device-booking"){
    const msg =
      `🔧 *DEVICE BOOKING — ${CONFIG.businessName}*\n\n${refLine}`+
      `*── Contact ──*\n👤 ${f.clientName||""}\n🏢 ${f.company||"N/A"}\n📞 ${f.phone||""}\n✉️ ${f.email||""}\n📍 ${f.address||"N/A"}\n\n`+
      `*── Device ──*\n📱 Type: ${f.deviceType||""}\n🏭 Make: ${f.manufacturer||""}\n📋 Model: ${f.modelNumber||""}\n🔢 Serial: ${f.serialNumber||"N/A"}\n💻 OS: ${f.operatingSystem||"N/A"}\n🛡️ Warranty: ${f.warrantyStatus||"Unknown"}\n\n`+
      `*── Problem ──*\n❗ ${f.problemDescription||""}\n🎒 Accessories: ${f.accessories||"None"}\n⚡ Urgency: ${f.urgency||""}\n🔍 Condition: ${f.conditionOnArrival||""}\n💥 Damage: ${f.physicalDamage||"None noted"}\n🔑 Password: ${f.devicePassword||"Not provided"}\n\n`+
      `*── Authorization ──*\n✅ Client has authorized diagnosis & repair`;
    return `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(msg)}`;
  }
  const msg =
    `Hello ${CONFIG.businessName}! 👋\n\n${refLine}*Service:* ${svc}\n`+
    `*Name:* ${f.name||f.clientName||""}\n*Phone:* ${f.phone||""}\n`+
    `*Issue:* ${f.issueTitle||""}\n${f.issueDetail?`*Details:* ${f.issueDetail}\n`:""}`;
  return `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(msg)}`;
}

function buildEmail(f, svcId, ref=""){
  const svc  = SVCLIST.find(s=>s.id===svcId)?.label || svcId;
  const subj = ref
    ? `Ticket ${ref} — ${f.issueTitle||f.problemDescription||"Device Booking"}`
    : `Support: ${f.issueTitle||f.problemDescription||svc}`;
  const body =
    `Hello ${CONFIG.businessName},\n\nRef: ${ref||"Pending"}\nService: ${svc}\n`+
    `Name: ${f.name||f.clientName||""}\nPhone: ${f.phone||""}\n`;
  return `mailto:${CONFIG.supportEmail}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
}

/* ═══════════════════════════════════════════════════════

function Label({children}){

}
function Field({label,error,span,children}){
  return(
    <div style={{gridColumn:span?"1/-1":undefined}}>
      <Label>{label}</Label>
      {children}
      {error&&<p style={{color:"#F87171",fontSize:12,marginTop:5}}>{error}</p>}

}
function SectionHead({num,title}){

    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20,
      paddingBottom:14,borderBottom:"1px solid #1C2433"}}>

      <div style={{fontSize:16,fontWeight:700,color:"#F1F5F9"}}>{title}</div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   DEVICE BOOKING FORM
   ═══════════════════════════════════════════════════════ */
function DeviceBookingForm({onSubmit, onBack}){
  const [f,setF] = useState({
    company:"", clientName:"", phone:"", email:"", address:"",
    deviceType:"", manufacturer:"", modelNumber:"", serialNumber:"",
    operatingSystem:"", warrantyStatus:"Unknown",
    problemDescription:"", accessories:"", urgency:"Standard (3–5 days)",
    conditionOnArrival:"Good – No visible damage", physicalDamage:"",
    devicePassword:"", authorized:false,
  });
  const [photos,  setPhotos]  = useState([]);
  const [errors,  setErrors]  = useState({});
  const fileRef = useRef();
  const set = (k,v) => setF(p=>({...p,[k]:v}));

  const handlePhotos = e => {
    const files  = Array.from(e.target.files||[]);
    const toAdd  = files.slice(0, 5-photos.length);
    Promise.all(toAdd.map(file=>new Promise(res=>{
      const r = new FileReader();
      r.onload = () => res({name:file.name, src:r.result});
      r.readAsDataURL(file);
    }))).then(imgs => setPhotos(p=>[...p,...imgs].slice(0,5)));
  };
  const handleDrop = e => {
    e.preventDefault();
    const files = Array.from(e.dataTransfer.files||[]).filter(f=>f.type.startsWith("image/"));
    const toAdd = files.slice(0, 5-photos.length);
    Promise.all(toAdd.map(file=>new Promise(res=>{
      const r = new FileReader();
      r.onload = () => res({name:file.name, src:r.result});
      r.readAsDataURL(file);
    }))).then(imgs => setPhotos(p=>[...p,...imgs].slice(0,5)));
  };

  const validate = () => {
    const e={};
    if(!f.clientName.trim())       e.clientName       = "Required";
    if(!f.phone.trim())            e.phone            = "Required";
    if(!f.deviceType)              e.deviceType       = "Select device type";
    if(!f.manufacturer.trim())     e.manufacturer     = "Required";
    if(!f.problemDescription.trim()) e.problemDescription = "Required";
    if(!f.authorized)              e.authorized       = "Authorization required to proceed";
    setErrors(e);
    return !Object.keys(e).length;
  };

  return(
    <div style={{minHeight:"100vh",background:"#07090F"}}>
      {/* mini header */}
      <header style={{background:"rgba(7,9,15,0.97)",borderBottom:"1px solid #1C2433",
        position:"sticky",top:0,zIndex:50,backdropFilter:"blur(16px)"}}>
        <div style={{maxWidth:800,margin:"0 auto",padding:"0 20px",
          display:"flex",justifyContent:"space-between",alignItems:"center",height:60}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{width:34,height:34,borderRadius:10,
              background:`linear-gradient(135deg,${AC},${AC2})`,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:17}}>⚡</div>
            <div>
              <div style={{fontSize:15,fontWeight:700,color:"#F1F5F9"}}>{CONFIG.businessName}</div>
              <div style={{fontSize:11,color:"#475569"}}>{CONFIG.tagline}</div>
            </div>
          </div>
          <button onClick={onBack}
            style={{background:"transparent",border:"1px solid #1C2433",color:"#94A3B8",
              padding:"7px 14px",borderRadius:8,cursor:"pointer",
              fontSize:13,fontFamily:"'Outfit',sans-serif"}}>← Back</button>
        </div>
      </header>

      <main style={{maxWidth:800,margin:"0 auto",padding:"36px 20px 80px"}}>
        {/* Page title */}
        <div style={{marginBottom:32}}>
          <div style={{display:"inline-flex",alignItems:"center",gap:8,
            background:`rgba(0,212,170,0.08)`,border:`1px solid ${AC}33`,
            borderRadius:8,padding:"5px 12px",marginBottom:12}}>
            <span style={{fontSize:13}}>💻</span>
            <span style={{fontSize:12,fontWeight:600,color:AC,
              letterSpacing:"0.06em",textTransform:"uppercase"}}>Device Service Booking</span>
          </div>
          <h1 style={{fontSize:30,fontWeight:800,letterSpacing:"-0.03em",
            color:"#F1F5F9",marginBottom:8}}>Book in Your Device for Service</h1>
          <p style={{color:"#64748B",fontSize:14}}>
            Complete all sections. This will be sent directly to our engineers via WhatsApp.
          </p>
        </div>

        {/* ── Section 1 ── */}
        <div style={{background:"#0D1117",border:"1px solid #1C2433",borderRadius:14,padding:24,marginBottom:16}} className="fade-up">
          <SectionHead num="1" title="Your Contact Information"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px 18px"}}>
            <Field label="Company" span>
              <input style={inp} value={f.company} onChange={e=>set("company",e.target.value)} placeholder="Company name (if applicable)"/>
            </Field>
            <Field label="Name & Surname *" error={errors.clientName}>
              <input style={inp} value={f.clientName} onChange={e=>set("clientName",e.target.value)} placeholder="John Doe"/>
            </Field>
            <Field label="Phone Number *" error={errors.phone}>
              <input style={inp} value={f.phone} onChange={e=>set("phone",e.target.value)} placeholder="+27 72 665 0565"/>
            </Field>
            <Field label="Email Address">
              <input style={inp} type="email" value={f.email} onChange={e=>set("email",e.target.value)} placeholder="john@example.com"/>
            </Field>
            <Field label="Address" span>
              <input style={inp} value={f.address} onChange={e=>set("address",e.target.value)} placeholder="123 Main St, Sandton, Johannesburg"/>
            </Field>
          </div>
        </div>

        {/* ── Section 2 ── */}
        <div style={{background:"#0D1117",border:"1px solid #1C2433",borderRadius:14,padding:24,marginBottom:16}} className="fade-up">
          <SectionHead num="2" title="Device Information"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px 18px"}}>
            <Field label="Device Type *" error={errors.deviceType}>
              <select style={selStyle} value={f.deviceType} onChange={e=>set("deviceType",e.target.value)}>
                <option value="">Select device type</option>
                {DEVICE_TYPES.map(d=><option key={d}>{d}</option>)}
              </select>
            </Field>
            <Field label="Manufacturer *" error={errors.manufacturer}>
              <input style={inp} value={f.manufacturer} onChange={e=>set("manufacturer",e.target.value)} placeholder="e.g. Dell, Apple, HP, Lenovo"/>
            </Field>
            <Field label="Model Number" span>
              <input style={inp} value={f.modelNumber} onChange={e=>set("modelNumber",e.target.value)} placeholder="e.g. MacBook Pro 13″ A2251, ThinkPad X1 Carbon 7th Gen"/>
            </Field>
            <Field label="Serial Number / Service Tag">
              <input style={inp} value={f.serialNumber} onChange={e=>set("serialNumber",e.target.value)} placeholder="e.g. 5CG1234ABC"/>
            </Field>
            <Field label="Operating System / Version">
              <input style={inp} value={f.operatingSystem} onChange={e=>set("operatingSystem",e.target.value)} placeholder="e.g. Windows 11 Pro, macOS Sonoma 14.5, iOS 17"/>
            </Field>
            <Field label="Warranty Status" span>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",paddingTop:4}}>
                {WARRANTY.map(w=>(
                  <label key={w} onClick={()=>set("warrantyStatus",w)}
                    style={{display:"flex",alignItems:"center",gap:6,fontSize:14,
                      color:f.warrantyStatus===w?"#E2E8F0":"#94A3B8",cursor:"pointer",
                      background:f.warrantyStatus===w?`rgba(0,212,170,0.08)`:"transparent",
                      border:`1px solid ${f.warrantyStatus===w?AC:"#1C2433"}`,
                      borderRadius:8,padding:"7px 14px",transition:"all 0.2s"}}>
                    {w}
                  </label>
                ))}
              </div>
            </Field>
          </div>
        </div>

        {/* ── Section 3 ── */}
        <div style={{background:"#0D1117",border:"1px solid #1C2433",borderRadius:14,padding:24,marginBottom:16}} className="fade-up">
          <SectionHead num="3" title="Problem Description"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"14px 18px"}}>
            <Field label="Problem Description *" error={errors.problemDescription} span>
              <textarea style={{...inp,resize:"vertical",minHeight:100,lineHeight:1.6}}
                value={f.problemDescription} onChange={e=>set("problemDescription",e.target.value)}
                placeholder="Describe the issue — error messages, symptoms, when it started..."/>
            </Field>
            <Field label="Accessories Supplied with Device" span>
              <input style={inp} value={f.accessories} onChange={e=>set("accessories",e.target.value)} placeholder="e.g. Charger, mouse, bag — or 'None'"/>
            </Field>
            <Field label="Urgency of Repair">
              <select style={selStyle} value={f.urgency} onChange={e=>set("urgency",e.target.value)}>
                {URGENCY.map(u=><option key={u}>{u}</option>)}
              </select>
            </Field>
            <Field label="Condition on Arrival / Collection">
              <select style={selStyle} value={f.conditionOnArrival} onChange={e=>set("conditionOnArrival",e.target.value)}>
                {CONDITION.map(c=><option key={c}>{c}</option>)}
              </select>
            </Field>
            <Field label="Physical Damage Noted">
              <input style={inp} value={f.physicalDamage} onChange={e=>set("physicalDamage",e.target.value)} placeholder="Describe visible damage, or 'None'"/>
            </Field>
            <Field label="Computer / Device Password">
              <input style={inp} value={f.devicePassword} onChange={e=>set("devicePassword",e.target.value)} placeholder="Leave blank if not required"/>
            </Field>
            {/* Photo upload */}
            <Field label="Device Photos (up to 5)" span>
              <div onDrop={handleDrop} onDragOver={e=>e.preventDefault()}
                onClick={()=>fileRef.current&&fileRef.current.click()}
                style={{border:`2px dashed ${photos.length>0?AC:"#1C2433"}`,
                  borderRadius:10,padding:photos.length>0?"16px":"28px 20px",
                  cursor:"pointer",transition:"all 0.2s",
                  background:photos.length>0?"rgba(0,212,170,0.04)":"transparent",
                  textAlign:"center"}}>
                <input ref={fileRef} type="file" accept="image/*" multiple onChange={handlePhotos}/>
                {photos.length===0 ? (
                  <>
                    <div style={{fontSize:28,marginBottom:8}}>📷</div>
                    <div style={{fontSize:14,color:"#64748B",marginBottom:4}}>
                      Drag &amp; drop images here, or click to browse
                    </div>
                    <div style={{fontSize:12,color:"#334155"}}>Up to 5 photos — JPG, PNG, HEIC</div>
                  </>
                ) : (
                  <div style={{display:"flex",gap:10,flexWrap:"wrap",justifyContent:"center"}}>
                    {photos.map((p,i)=>(
                      <div key={i} style={{position:"relative"}}>
                        <img src={p.src} alt={p.name}
                          style={{width:80,height:80,objectFit:"cover",borderRadius:8,border:`1px solid ${AC}44`}}/>
                        <button onClick={e=>{e.stopPropagation();setPhotos(ph=>ph.filter((_,j)=>j!==i));}}
                          style={{position:"absolute",top:-6,right:-6,width:20,height:20,

              border:`2px solid ${f.authorized?AC:"#334155"}`,

          </label>
          {errors.authorized&&<p style={{color:"#F87171",fontSize:12,marginTop:8}}>{errors.authorized}</p>}
        </div>

        {/* Submit row */}
        <div style={{display:"flex",gap:12,justifyContent:"space-between",alignItems:"center",flexWrap:"wrap"}}>
          <button onClick={onBack}
            style={{background:"transparent",color:"#94A3B8",border:"1px solid #1C2433",
              borderRadius:10,padding:"12px 22px",fontSize:14,fontWeight:600,
              cursor:"pointer",fontFamily:"'Outfit',sans-serif"}}>← Back</button>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <a href={buildWA(f,"device-booking")} target="_blank" rel="noreferrer"
              style={{display:"inline-flex",alignItems:"center",gap:8,background:"#25D366",
                color:"#fff",padding:"12px 20px",borderRadius:10,fontSize:14,
                fontWeight:700,fontFamily:"'Outfit',sans-serif"}}>

            <button onClick={()=>{if(validate()) onSubmit({...f, photos:photos.map(p=>p.name), serviceType:"device-booking"});}}

                border:"none",borderRadius:10,padding:"12px 28px",fontSize:14,
                fontWeight:700,cursor:"pointer",fontFamily:"'Outfit',sans-serif"}}>
              Submit &amp; Get Ticket Ref ✓
            </button>
          </div>
        </div>
      </main>
    </div>
  );
}

      </header>
      <main style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:"#0D1117",border:"1px solid #1C2433",borderRadius:14,
          padding:32,maxWidth:340,width:"100%"}}>
          <div style={{width:48,height:48,borderRadius:12,
            background:`linear-gradient(135deg,${AC},${AC2})`,
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:22,marginBottom:16}}>🔐</div>
          <h2 style={{fontSize:20,fontWeight:700,marginBottom:4,color:"#F1F5F9"}}>Admin Access</h2>
          <p style={{color:"#475569",fontSize:13,marginBottom:20}}>Sign in to manage tickets</p>
          <Label>Password</Label>
          <input style={{...inp,marginBottom:8}} type="password" value={pw}
            onChange={e=>setPw(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&tryLogin()}
            placeholder="Enter admin password" autoFocus/>
          {pwErr&&<p style={{color:"#F87171",fontSize:12,marginBottom:8}}>{pwErr}</p>}
          <button onClick={tryLogin}
            style={{background:`linear-gradient(135deg,${AC},${AC2})`,color:"#07090F",
              border:"none",borderRadius:10,padding:"12px 24px",fontSize:14,
              fontWeight:700,cursor:"pointer",fontFamily:"'Outfit',sans-serif",
              width:"100%",marginTop:8}}>Login →</button>
        </div>
      </main>
    </div>
  );

  const filtered = tickets.filter(t=>{
    if(fSt!=="all" && t.status!==fSt) return false;
    if(fTy!=="all" && t.serviceType!==fTy) return false;
    const hay = `${t.ref} ${t.name||""} ${t.clientName||""} ${t.issueTitle||""} ${t.problemDescription||""} ${t.phone||""}`.toLowerCase();
    if(srch && !hay.includes(srch.toLowerCase())) return false;
    return true;
  });
  const tk      = sel ? tickets.find(t=>t.ref===sel) : null;
  const doNote  = () => { if(note.trim()){ onAddNote(sel,note.trim()); setNote(""); }};
  const doQuote = () => onUpdate(sel,{quotationRef:eqRef});

  return(
    <div style={{minHeight:"100vh",background:"#07090F"}}>
      <header style={{background:"rgba(7,9,15,0.97)",borderBottom:"1px solid #1C2433",
        position:"sticky",top:0,zIndex:50,backdropFilter:"blur(16px)"}}>
        <div style={{maxWidth:1300,margin:"0 auto",padding:"0 20px",
          display:"flex",justifyContent:"space-between",alignItems:"center",height:60}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:32,height:32,borderRadius:9,
              background:`linear-gradient(135deg,${AC},${AC2})`,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>⚡</div>
            <div>
              <div style={{fontSize:15,fontWeight:700,color:"#F1F5F9"}}>{CONFIG.businessName}</div>
              <div style={{fontSize:11,color:"#475569"}}>Admin Portal</div>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <a href={CONFIG.zohoPortal} target="_blank" rel="noreferrer"
              style={{display:"inline-flex",alignItems:"center",gap:6,background:"transparent",
                border:"1px solid #1C2433",color:"#94A3B8",padding:"7px 14px",
                borderRadius:8,fontSize:13,fontWeight:500}}>📊 Zoho Books</a>
            <button onClick={onBack}
              style={{background:"transparent",border:"1px solid #1C2433",color:"#94A3B8",
                padding:"7px 14px",borderRadius:8,cursor:"pointer",
                fontSize:13,fontFamily:"'Outfit',sans-serif"}}>← Portal</button>
          </div>
        </div>
      </header>

      <main style={{maxWidth:1300,margin:"0 auto",padding:"24px 20px 60px"}}>
        {/* Status stats */}
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:20}}>
          <div onClick={()=>setFSt("all")}
            style={{display:"flex",alignItems:"center",gap:6,background:"#0D1117",
              border:`1px solid ${fSt==="all"?AC:"#1C2433"}`,borderRadius:8,
              padding:"6px 12px",cursor:"pointer",fontSize:13}}>
            <span style={{color:"#E2E8F0",fontWeight:700}}>All</span>
            <span style={{fontFamily:"'IBM Plex Mono',monospace",color:"#64748B",marginLeft:4}}>
              {tickets.length}
            </span>
          </div>
          {Object.entries(STATUSES).map(([k,v])=>{
            const cnt = tickets.filter(t=>t.status===k).length;
            return(
              <div key={k} onClick={()=>setFSt(fSt===k?"all":k)}
                style={{display:"flex",alignItems:"center",gap:6,background:"#0D1117",
                  border:`1px solid ${fSt===k?v.color:"#1C2433"}`,borderRadius:8,
                  padding:"6px 12px",cursor:"pointer",fontSize:13}}>
                <span style={{width:8,height:8,borderRadius:"50%",
                  background:v.color,display:"inline-block",flexShrink:0}}/>
                <span style={{color:"#94A3B8"}}>{v.label}</span>
                <span style={{fontFamily:"'IBM Plex Mono',monospace",fontWeight:600,
                  color:"#E2E8F0",marginLeft:2}}>{cnt}</span>
              </div>
            );
          })}
        </div>

        <div style={{display:"grid",gridTemplateColumns:"300px 1fr",gap:14,alignItems:"start"}}>
          {/* Ticket list */}
          <div style={{background:"#0D1117",border:"1px solid #1C2433",borderRadius:12,
            padding:12,maxHeight:"82vh",overflowY:"auto"}}>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
              <input style={{...inp,fontSize:13}} placeholder="🔍 Search..." value={srch} onChange={e=>setSrch(e.target.value)}/>
              <select style={{...selStyle,fontSize:13}} value={fTy} onChange={e=>setFTy(e.target.value)}>
                <option value="all">All Types</option>
                {SVCLIST.map(s=><option key={s.id} value={s.id}>{s.label}</option>)}
              </select>
            </div>
            {filtered.length===0&&
              <p style={{color:"#334155",textAlign:"center",padding:24,fontSize:13}}>No tickets found</p>}
            {filtered.map(t=>(
              <div key={t.ref} onClick={()=>{setSel(t.ref);setEqRef(t.quotationRef||"");}}
                style={{padding:"11px 13px",borderRadius:8,marginBottom:5,cursor:"pointer",
                  background:sel===t.ref?"rgba(0,212,170,0.05)":"#07090F",
                  borderLeft:`3px solid ${sel===t.ref?AC:STATUSES[t.status]?.color||"#1C2433"}`,
                  transition:"all 0.15s"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                  <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,color:"#475569"}}>{t.ref}</span>
                  <span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:20,
                    background:STATUSES[t.status]?.color+"22",color:STATUSES[t.status]?.color}}>
                    {STATUSES[t.status]?.label}
                  </span>
                </div>
                <div style={{fontSize:14,fontWeight:600,color:"#E2E8F0",marginBottom:2}}>
                  {t.clientName||t.name||"—"}
                </div>
                <div style={{fontSize:12,color:"#64748B",marginBottom:3,
                  whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                  {t.issueTitle||t.problemDescription||"—"}
                </div>
                <div style={{fontSize:11,color:"#334155"}}>
                  {SVCLIST.find(s=>s.id===t.serviceType)?.icon}{" "}
                  {new Date(t.createdAt).toLocaleDateString("en-ZA")} · {t.priority}
                </div>
              </div>
            ))}
          </div>

          {/* Detail panel */}
          {tk ? (
            <div style={{background:"#0D1117",border:"1px solid #1C2433",borderRadius:12,
              padding:24,maxHeight:"82vh",overflowY:"auto"}}>
              {/* Header */}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",
                marginBottom:20,paddingBottom:16,borderBottom:"1px solid #1C2433"}}>
                <div>
                  <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:13,color:AC,marginBottom:4}}>{tk.ref}</div>
                  <div style={{fontSize:22,fontWeight:700,color:"#F1F5F9"}}>{tk.clientName||tk.name||"—"}</div>
                  <div style={{color:"#64748B",fontSize:13,marginTop:4}}>
                    {tk.phone||"—"}{tk.email&&` · ${tk.email}`}
                  </div>
                </div>
                <span style={{fontSize:12,fontWeight:700,padding:"4px 10px",borderRadius:20,
                  background:STATUSES[tk.status]?.color+"22",color:STATUSES[tk.status]?.color}}>
                  {STATUSES[tk.status]?.label}
                </span>
              </div>

              {/* Status buttons */}
              <div style={{marginBottom:20}}>
                <Label>Update Status</Label>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:8}}>
                  {Object.entries(STATUSES).map(([k,v])=>(
                    <button key={k} onClick={()=>onUpdate(tk.ref,{status:k})}
                      style={{border:`1px solid ${v.color}`,borderRadius:6,padding:"5px 10px",
                        fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"'Outfit',sans-serif",
                        background:tk.status===k?v.color:"transparent",
                        color:tk.status===k?"#07090F":v.color,transition:"all 0.15s"}}>
                      {v.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Info table */}
              <div style={{marginBottom:20}}>
                <Label>Ticket Details</Label>
                <div style={{borderRadius:8,overflow:"hidden",border:"1px solid #1C2433",marginTop:8}}>
                  {[
                    ["Service",   SVCLIST.find(s=>s.id===tk.serviceType)?.label],
                    tk.company&&  ["Company",   tk.company],
                    ["Priority",  tk.priority],
                    tk.deviceType&&["Device",   `${tk.manufacturer||""} ${tk.modelNumber||""} (${tk.deviceType})`],
                    tk.serialNumber&&["Serial", tk.serialNumber],
                    tk.operatingSystem&&["OS",  tk.operatingSystem],
                    tk.warrantyStatus&&["Warranty", tk.warrantyStatus],
                    tk.address&&  ["Address",   tk.address],
                    tk.preferredDate&&["Preferred", `${tk.preferredDate} ${tk.preferredTime}`],
                    ["Contact",   tk.contactMethod||"whatsapp"],
                    ["Submitted", new Date(tk.createdAt).toLocaleString("en-ZA")],
                    tk.quotationRef&&["Quotation", tk.quotationRef],
                  ].filter(Boolean).map(([l,v],i)=>(
                    <div key={i} style={{display:"flex",padding:"8px 12px",borderBottom:"1px solid #1C2433"}}>
                      <span style={{color:"#64748B",fontSize:12,width:110,flexShrink:0}}>{l}</span>
                      <span style={{color:"#CBD5E1",fontSize:12}}>{v}</span>
                    </div>
                  ))}
                </div>
              </div>

              {/* Issue */}
              <div style={{marginBottom:20}}>
                <Label>Issue / Problem</Label>
                <div style={{background:"#07090F",borderRadius:8,padding:"12px 14px",marginTop:8}}>
                  <p style={{fontSize:14,fontWeight:600,color:"#E2E8F0",marginBottom:6}}>
                    {tk.issueTitle||tk.problemDescription||"—"}
                  </p>
                  {tk.issueDetail&&   <p style={{fontSize:13,color:"#94A3B8",lineHeight:1.6}}>{tk.issueDetail}</p>}
                  {tk.accessories&&   <p style={{fontSize:13,color:"#64748B",marginTop:6}}>🎒 Accessories: {tk.accessories}</p>}
                  {tk.physicalDamage&&<p style={{fontSize:13,color:"#64748B",marginTop:4}}>💥 Damage: {tk.physicalDamage}</p>}
                  {tk.devicePassword&&<p style={{fontSize:13,color:"#64748B",marginTop:4}}>🔑 Password: {tk.devicePassword}</p>}
                  {tk.conditionOnArrival&&<p style={{fontSize:13,color:"#64748B",marginTop:4}}>🔍 Condition: {tk.conditionOnArrival}</p>}
                  {tk.urgency&&       <p style={{fontSize:13,color:"#64748B",marginTop:4}}>⚡ Urgency: {tk.urgency}</p>}
                </div>
              </div>

              {/* Quotation ref */}
              <div style={{marginBottom:20}}>
                <Label>Link Quotation Reference</Label>
                <div style={{display:"flex",gap:8,marginTop:8}}>
                  <input style={{...inp,flex:1,fontSize:13}} value={eqRef}
                    onChange={e=>setEqRef(e.target.value)} placeholder="QUO-2025-001"/>
                  <button onClick={doQuote}
                    style={{background:AC,color:"#07090F",border:"none",borderRadius:8,
                      padding:"8px 16px",fontSize:13,fontWeight:700,cursor:"pointer",
                      fontFamily:"'Outfit',sans-serif",whiteSpace:"nowrap"}}>Link</button>
                </div>
                {tk.quotationRef&&
                  <p style={{color:AC,fontSize:12,marginTop:6}}>✓ Linked: {tk.quotationRef}</p>}
              </div>

              {/* Quick contact */}
              <div style={{marginBottom:20}}>
                <Label>Quick Contact</Label>
                <div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>
                  <a href={`https://wa.me/${(tk.phone||"").replace(/[^0-9]/g,"")}?text=${encodeURIComponent(`Hi ${tk.clientName||tk.name||"there"}, regarding your ticket ${tk.ref} — `)}`}
                    target="_blank" rel="noreferrer"
                    style={{display:"inline-flex",alignItems:"center",gap:6,background:"#25D366",
                      color:"#fff",padding:"8px 14px",borderRadius:8,fontSize:13,
                      fontWeight:700,fontFamily:"'Outfit',sans-serif"}}>💬 WhatsApp</a>
                  {tk.email&&(
                    <a href={`mailto:${tk.email}?subject=Re: Ticket ${tk.ref}&body=Hi ${tk.clientName||tk.name||"there"},%0D%0A%0D%0ARegarding ticket ${tk.ref}:%0D%0A`}
                      style={{display:"inline-flex",alignItems:"center",gap:6,background:AC2,
                        color:"#fff",padding:"8px 14px",borderRadius:8,fontSize:13,
                        fontWeight:700,fontFamily:"'Outfit',sans-serif"}}>✉️ Email</a>
                  )}
                  <a href={CONFIG.zohoPortal} target="_blank" rel="noreferrer"
                    style={{display:"inline-flex",alignItems:"center",gap:6,
                      background:"rgba(14,165,233,0.1)",border:"1px solid rgba(14,165,233,0.2)",
                      color:AC2,padding:"8px 14px",borderRadius:8,fontSize:13,fontWeight:600}}>
                    📊 Zoho Books
                  </a>
                </div>
              </div>

              {/* Notes */}
              <div>
                <Label>Internal Notes &amp; Updates</Label>
                <div style={{maxHeight:160,overflowY:"auto",marginTop:8,marginBottom:10}}>
                  {tk.notes.length===0&&
                    <p style={{color:"#334155",fontSize:13}}>No notes yet</p>}
                  {tk.notes.map((n,i)=>(
                    <div key={i} style={{background:"#07090F",borderRadius:8,
                      padding:"10px 12px",marginBottom:6}}>
                      <p style={{color:"#CBD5E1",fontSize:13,marginBottom:4,lineHeight:1.5}}>{n.text}</p>
                      <p style={{color:"#334155",fontSize:11,fontFamily:"'IBM Plex Mono',monospace"}}>
                        {new Date(n.at).toLocaleString("en-ZA")}
                      </p>
                    </div>
                  ))}
                </div>
                <textarea style={{...inp,resize:"vertical",minHeight:64,fontSize:13,
                  lineHeight:1.5,marginBottom:8,width:"100%"}}
                  value={note} onChange={e=>setNote(e.target.value)}
                  placeholder="Add update, action taken, parts ordered..."/>
                <button onClick={doNote}
                  style={{background:AC,color:"#07090F",border:"none",borderRadius:8,
                    padding:"9px 18px",fontSize:13,fontWeight:700,cursor:"pointer",
                    fontFamily:"'Outfit',sans-serif"}}>Add Note</button>
              </div>
            </div>
          ) : (
            <div style={{background:"#0D1117",border:"1px solid #1C2433",borderRadius:12,
              display:"flex",alignItems:"center",justifyContent:"center",
              minHeight:300,color:"#1C2433",fontSize:15}}>
              ← Select a ticket to view details
            </div>
          )}
        </div>
      </main>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   ROOT APP
   ═══════════════════════════════════════════════════════ */
function App(){
  const [view,       setView]       = useState("portal");
  const [tickets,    setTickets]    = useState(loadTickets);
  const [lastTicket, setLastTicket] = useState(null);
  const [adminAuthed,setAdminAuthed]= useState(false);

  const addTicket = form => {
    const ref = genRef();
    const t   = {...form, ref, status:"open",
      createdAt:new Date().toISOString(),
      updatedAt:new Date().toISOString(),
      notes:[], quotationRef:""};
    const updated = [t,...tickets];
    setTickets(updated); saveTickets(updated);
    setLastTicket(t); setView("success");
  };
  const updateTicket = (ref,changes) => {
    const updated = tickets.map(t=>t.ref===ref
      ? {...t,...changes,updatedAt:new Date().toISOString()} : t);
    setTickets(updated); saveTickets(updated);
  };
  const addNote = (ref,text) => {
    const updated = tickets.map(t=>t.ref===ref
      ? {...t, notes:[...t.notes,{text,at:new Date().toISOString()}],
          updatedAt:new Date().toISOString()} : t);
    setTickets(updated); saveTickets(updated);
  };

  return(
    <>
      {view==="portal"         && <CustomerPortal   onSubmit={addTicket} onAdminClick={()=>setView("admin")} onDeviceBooking={()=>setView("device-booking")}/>}
      {view==="device-booking" && <DeviceBookingForm onSubmit={addTicket} onBack={()=>setView("portal")}/>}
      {view==="success" && lastTicket && <SuccessScreen ticket={lastTicket} onBack={()=>setView("portal")}/>}
      {view==="admin"          && <AdminPortal tickets={tickets} authed={adminAuthed} onAuth={()=>setAdminAuthed(true)} onUpdate={updateTicket} onAddNote={addNote} onBack={()=>setView("portal")}/>}
    </>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
