<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#050810;}
body{font-family:'Plus Jakarta Sans',sans-serif;color:#E2E8F0;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#1E2A3A;border-radius:4px;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:#00C896!important;box-shadow:0 0 0 3px rgba(0,200,150,0.1)!important;}
input[type="file"]{display:none;}
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(0.4);}

@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideIn{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

.fu{animation:fadeUp 0.35s ease forwards;}
.si{animation:slideIn 0.3s ease forwards;}

/* ── LAYOUT ─────────────────────────────────────── */
.app-shell{display:flex;flex-direction:column;min-height:100vh;}

/* ── SIDEBAR ─────────────────────────────────────── */
.sidebar{width:240px;background:#080D18;border-right:1px solid #0F1C2E;display:flex;flex-direction:column;flex-shrink:0;}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid #0F1C2E;}
.sidebar-logo .brand{display:flex;align-items:center;gap:10px;}
.sidebar-logo .icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#00C896,#0EA5E9);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.sidebar-logo .name{font-size:14px;font-weight:700;color:#F1F5F9;letter-spacing:-0.01em;line-height:1.2;}
.sidebar-logo .sub{font-size:10px;color:#475569;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto;}
.nav-section{margin-bottom:20px;}
.nav-label{font-size:10px;font-weight:700;color:#334155;text-transform:uppercase;letter-spacing:0.1em;padding:0 8px;margin-bottom:6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:500;color:#64748B;cursor:pointer;transition:all 0.15s;border:none;background:transparent;width:100%;text-align:left;}
.nav-item:hover{background:#0D1624;color:#CBD5E1;}
.nav-item.active{background:rgba(0,200,150,0.1);color:#00C896;font-weight:600;}
.nav-item .ni{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.nav-item .badge{margin-left:auto;background:#EF4444;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;font-family:'IBM Plex Mono',monospace;}
.sidebar-bottom{padding:12px 10px;border-top:1px solid #0F1C2E;}
.status-pill{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0D1624;border-radius:8px;}
.status-dot{width:7px;height:7px;border-radius:50%;background:#00C896;box-shadow:0 0 6px #00C896;animation:pulse 2s infinite;}
.status-text{font-size:11px;color:#64748B;font-weight:500;}

/* ── TOPBAR ──────────────────────────────────────── */
.topbar{height:56px;background:#080D18;border-bottom:1px solid #0F1C2E;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-title{font-size:16px;font-weight:700;color:#F1F5F9;}
.topbar-sub{font-size:12px;color:#475569;}
.topbar-right{display:flex;align-items:center;gap:8px;}

/* ── CONTENT ─────────────────────────────────────── */
.page-content{flex:1;overflow-y:auto;padding:24px;}
.main-layout{display:flex;min-height:100vh;}
.content-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* ── CARDS ───────────────────────────────────────── */
.card{background:#080D18;border:1px solid #0F1C2E;border-radius:12px;}
.card-body{padding:20px;}
.card-header{padding:16px 20px;border-bottom:1px solid #0F1C2E;display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:14px;font-weight:700;color:#F1F5F9;}

/* ── STAT CARDS ──────────────────────────────────── */
.stats-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px;}
.stat-card{background:#080D18;border:1px solid #0F1C2E;border-radius:10px;padding:14px 16px;}
.stat-val{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;color:#F1F5F9;margin-bottom:2px;}
.stat-lbl{font-size:11px;color:#475569;font-weight:500;}
.stat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}

/* ── FORMS ───────────────────────────────────────── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
.form-grid.cols3{grid-template-columns:1fr 1fr 1fr;}
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-field.span2{grid-column:1/-1;}
.field-label{font-size:11px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.08em;}
.field-input{background:#050810;border:1px solid #0F1C2E;border-radius:8px;padding:10px 13px;color:#E2E8F0;font-size:13px;transition:border 0.2s,box-shadow 0.2s;width:100%;}
.field-input::placeholder{color:#334155;}
select.field-input{cursor:pointer;}
textarea.field-input{resize:vertical;min-height:88px;line-height:1.6;}
.field-error{font-size:11px;color:#F87171;margin-top:2px;}

/* ── BUTTONS ─────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:8px;font-weight:600;font-family:inherit;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,#00C896,#0EA5E9);color:#050810;padding:10px 20px;font-size:13px;}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
.btn-secondary{background:transparent;border:1px solid #0F1C2E;color:#94A3B8;padding:9px 18px;font-size:13px;}
.btn-secondary:hover{border-color:#1E2A3A;color:#CBD5E1;}
.btn-ghost{background:transparent;color:#64748B;padding:8px 14px;font-size:13px;border:none;}
.btn-ghost:hover{color:#94A3B8;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-wa{background:#25D366;color:#fff;padding:10px 18px;font-size:13px;border-radius:8px;}
.btn-email{background:#3B82F6;color:#fff;padding:10px 18px;font-size:13px;border-radius:8px;}
.btn-danger{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#F87171;padding:8px 14px;font-size:12px;}

/* ── BADGE / STATUS ──────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.05em;}

/* ── TABLE ───────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:10px;font-weight:700;color:#334155;text-transform:uppercase;letter-spacing:0.08em;padding:10px 14px;border-bottom:1px solid #0F1C2E;text-align:left;}
.tbl td{padding:11px 14px;border-bottom:1px solid #080D18;font-size:13px;color:#94A3B8;vertical-align:middle;}
.tbl tr:hover td{background:rgba(255,255,255,0.015);}
.tbl tr.selected td{background:rgba(0,200,150,0.04);}
.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;}

/* ── TICKET DETAIL PANEL ─────────────────────────── */
.detail-panel{width:380px;background:#080D18;border-left:1px solid #0F1C2E;display:flex;flex-direction:column;flex-shrink:0;}
.detail-panel.hidden{display:none;}
.detail-header{padding:16px 20px;border-bottom:1px solid #0F1C2E;}
.detail-body{flex:1;overflow-y:auto;padding:16px 20px;}
.detail-row{display:flex;padding:8px 0;border-bottom:1px solid #0A1525;}
.detail-key{font-size:11px;color:#475569;width:100px;flex-shrink:0;padding-top:1px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
.detail-val{font-size:12px;color:#CBD5E1;flex:1;}

/* ── SECTION HEADER ──────────────────────────────── */
.section-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #0F1C2E;}
.section-num{width:28px;height:28px;border-radius:7px;background:rgba(0,200,150,0.1);border:1px solid rgba(0,200,150,0.25);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:#00C896;flex-shrink:0;}
.section-title{font-size:14px;font-weight:700;color:#F1F5F9;}

/* ── RADIO CHIPS ─────────────────────────────────── */
.radio-chips{display:flex;gap:8px;flex-wrap:wrap;padding-top:2px;}
.chip{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #0F1C2E;color:#64748B;transition:all 0.2s;user-select:none;}
.chip.active{border-color:#00C896;background:rgba(0,200,150,0.08);color:#00C896;font-weight:600;}

/* ── SEARCH BAR ──────────────────────────────────── */
.searchbar{position:relative;}
.searchbar input{width:100%;background:#050810;border:1px solid #0F1C2E;border-radius:8px;padding:9px 12px 9px 36px;color:#E2E8F0;font-size:13px;}
.searchbar::before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#334155;font-size:15px;}

/* ── TOAST ───────────────────────────────────────── */
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 32px rgba(0,0,0,0.5);animation:toastIn 0.3s ease;}
.toast.ok{background:#00C896;color:#050810;}
.toast.error{background:#EF4444;color:#fff;}
.toast.info{background:#0EA5E9;color:#fff;}

/* ── PORTAL (customer-facing) ────────────────────── */
.portal-wrap{min-height:100vh;background:#050810;}
.portal-header{background:rgba(5,8,16,0.96);border-bottom:1px solid #0F1C2E;position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);}
.portal-header-inner{max-width:760px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;height:58px;}
.portal-main{max-width:760px;margin:0 auto;padding:40px 20px 80px;}

/* ── QUICK LINKS ─────────────────────────────────── */
.ql-bar{background:#080D18;border-bottom:1px solid #0F1C2E;}
.ql-inner{max-width:760px;margin:0 auto;padding:9px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.ql-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:16px;font-size:11px;font-weight:600;}

/* ── NOTES ───────────────────────────────────────── */
.note-item{background:#050810;border-radius:8px;padding:10px 12px;margin-bottom:6px;border:1px solid #0A1525;}
.note-text{font-size:12px;color:#CBD5E1;line-height:1.55;margin-bottom:4px;}
.note-meta{font-size:10px;color:#334155;font-family:'IBM Plex Mono',monospace;}

/* ── DIVIDER ─────────────────────────────────────── */
.divider{height:1px;background:#0F1C2E;margin:16px 0;}

/* ── PHOTO UPLOAD ────────────────────────────────── */
.photo-drop{border:2px dashed #1E2A3A;border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:all 0.2s;}
.photo-drop:hover,.photo-drop.over{border-color:#00C896;background:rgba(0,200,150,0.03);}
.photo-grid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.photo-thumb{position:relative;}
.photo-thumb img{width:72px;height:72px;object-fit:cover;border-radius:7px;border:1px solid rgba(0,200,150,0.3);}
.photo-rm{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:#EF4444;border:none;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;}

/* ── WA PREVIEW ──────────────────────────────────── */
.wa-preview{background:#0A1B12;border:1px solid rgba(37,211,102,0.2);border-radius:10px;padding:14px 16px;}
.wa-bubble{background:#1B3D24;border-radius:12px 12px 12px 2px;padding:10px 14px;font-size:12px;color:#D1FAE5;line-height:1.7;white-space:pre-wrap;font-family:'IBM Plex Mono',monospace;}

/* ── SPINNER ─────────────────────────────────────── */
.spinner-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#050810;flex-direction:column;gap:16px;}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid rgba(0,200,150,0.2);border-top-color:#00C896;animation:spin 0.75s linear infinite;}

/* ── MOBILE ──────────────────────────────────────── */
@media(max-width:900px){
  .sidebar{display:none;}
  .stats-row{grid-template-columns:repeat(3,1fr);}
  .detail-panel{width:100%;border-left:none;border-top:1px solid #0F1C2E;}
  .admin-body{flex-direction:column!important;}
}
@media(max-width:600px){
  .form-grid{grid-template-columns:1fr;}
  .form-grid.cols3{grid-template-columns:1fr;}
  .stats-row{grid-template-columns:repeat(2,1fr);}
}
</style>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

/* ── CONFIG ──────────────────────────────────────────── */
const CFG={

const AC="#00C896",AC2="#0EA5E9";

/* ── LOOKUP TABLES ───────────────────────────────────── */
const ST={
  open:           {l:"Open",           c:"#3B82F6"},
  "in-progress":  {l:"In Progress",    c:"#F59E0B"},
  awaiting:       {l:"Awaiting Parts", c:"#8B5CF6"},
  resolved:       {l:"Resolved",       c:"#10B981"},
  closed:         {l:"Closed",         c:"#6B7280"},
  quoted:         {l:"Quoted",         c:"#EC4899"},
};
const SVCS=[
  {id:"device",   label:"Device Drop-off",   icon:"💻"},
  {id:"remote",   label:"Remote Support",    icon:"🌐"},
  {id:"onsite",   label:"On-Site Support",   icon:"🔧"},
];
const PRIS=["Low","Medium","High","Urgent"];
const DEVT=["Laptop","Desktop","All-in-One PC","Tablet","Smartphone","Server","Printer / Peripheral","Networking Device","Other"];
const WARR=["Under Warranty","Out of Warranty","Unknown"];
const URG=["Standard (3–5 days)","Urgent (1–2 days)","Same Day"];
const COND=["Good – No visible damage","Minor scratches","Cracked screen","Liquid damage","Physically broken","Other"];

/* ── FIRESTORE ───────────────────────────────────────── */
let _counter=1000;
async function nextTicketNumber(){
  const ref=db.collection("meta").doc("counter");
  const snap=await ref.get();
  let n=_counter;
  if(snap.exists){n=snap.data().val+1;}else{n=1001;}
  await ref.set({val:n});
  return n;
}
async function fsAdd(t){await db.collection("tickets").doc(t.ref).set(t);}
async function fsUpdate(ref,ch){await db.collection("tickets").doc(ref).update({...ch,updatedAt:ts()});}
async function fsNote(ref,txt){
  const s=await db.collection("tickets").doc(ref).get();
  const notes=[...(s.data().notes||[]),{txt,at:ts()}];
  await db.collection("tickets").doc(ref).update({notes,updatedAt:ts()});
}
function ts(){return new Date().toISOString();}
function makeTktRef(num){return`CIM-${String(num).padStart(4,"0")}`;}

/* ── WHATSAPP URL BUILDER ────────────────────────────── */
function waUrl(phone,msg){
  const clean=String(phone||"").replace(/[^0-9]/g,"");
  // if starts with 0, replace with 27
  const num=clean.startsWith("0")?"27"+clean.slice(1):clean;
  return`https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}

// Message sent to CUSTOMER confirming their ticket
function buildCustomerMsg(t){
  const svc=SVCS.find(s=>s.id===t.serviceType)?.label||t.serviceType;
  return(
`Hello ${t.clientName||t.name} 👋

Your support ticket has been logged with *${CFG.bizName}*.

📋 *Ticket Reference:* ${t.ref}
🔧 *Service:* ${svc}
📅 *Logged:* ${new Date(t.createdAt).toLocaleString("en-ZA")}
⚡ *Priority:* ${t.priority}

*Issue:* ${t.issueTitle||t.problemDescription||"—"}

Our team will be in touch shortly. Please quote your ticket reference in all future communication.

_${CFG.bizName} — ${CFG.tagline}_`
  );
}

// Message sent to BUSINESS as internal reference copy
function buildBusinessMsg(t){
  const svc=SVCS.find(s=>s.id===t.serviceType)?.label||t.serviceType;
  return(
`🔔 *NEW TICKET — ${t.ref}*

👤 *Client:* ${t.clientName||t.name}
🏢 *Company:* ${t.company||"N/A"}
📞 *Phone:* ${t.phone}
✉️ *Email:* ${t.email||"N/A"}
🔧 *Service:* ${svc}
⚡ *Priority:* ${t.priority}
📅 *Logged by:* ${t.loggedBy==="engineer"?"Engineer (on behalf)":"Customer (self)"}

*Issue:* ${t.issueTitle||t.problemDescription||"—"}
${t.issueDetail?`*Detail:* ${t.issueDetail}`:""}
${t.deviceType?`\n💻 *Device:* ${t.manufacturer||""} ${t.modelNumber||""} (${t.deviceType})`:""}
${t.serialNumber?`🔢 *Serial:* ${t.serialNumber}`:""}
${t.address?`📍 *Address:* ${t.address}`:""}
${t.devicePassword?`🔑 *Password:* ${t.devicePassword}`:""}

_Manage at your admin portal_`
  );
}

/* ── TINY ATOMS ──────────────────────────────────────── */
function Lbl({c,req}){return<div className="field-label">{c}{req&&<span style={{color:"#F87171",marginLeft:3}}>*</span>}</div>;}
function Field({l,e,span,children}){return<div className={`form-field${span?" span2":""}`}><Lbl c={l}/>{children}{e&&<div className="field-error">{e}</div>}</div>;}
function SecHead({n,t}){return<div className="section-head"><div className="section-num">{n}</div><div className="section-title">{t}</div></div>;}

function StatusBadge({s}){
  const v=ST[s]||{l:s,c:"#64748B"};
  return<span className="badge" style={{background:v.c+"20",color:v.c}}><span style={{width:5,height:5,borderRadius:"50%",background:v.c,display:"inline-block"}}/>{v.l}</span>;
}

function Spinner(){return<div className="spinner-wrap"><div className="spinner"/><p style={{color:"#475569",fontSize:14}}>Connecting to Firebase…</p></div>;}

function Toast({msg,type}){if(!msg)return null;return<div className={`toast ${type||"ok"}`}>{msg}</div>;}

/* ── SHARED INPUT STYLES ─────────────────────────────── */
const fi={className:"field-input"};

/* ── HEADER (portal) ─────────────────────────────────── */
function PortalHeader({onAdminClick}){
  return(
    <header className="portal-header">
      <div className="portal-header-inner">
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:34,height:34,borderRadius:9,background:`linear-gradient(135deg,${AC},${AC2})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>⚡</div>
          <div>
            <div style={{fontSize:15,fontWeight:700,color:"#F1F5F9",letterSpacing:"-0.01em"}}>{CFG.bizName}</div>
            <div style={{fontSize:10,color:"#475569",fontWeight:500,letterSpacing:"0.05em",textTransform:"uppercase"}}>{CFG.tagline}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <a href={CFG.zoho} target="_blank" rel="noreferrer" className="btn btn-secondary btn-sm">📊 Zoho Portal</a>
          <button onClick={onAdminClick} className="btn btn-sm" style={{background:`rgba(0,200,150,0.1)`,border:`1px solid ${AC}44`,color:AC}}>Admin →</button>
        </div>
      </div>
    </header>
  );
}

function QLBar(){
  return(
    <div className="ql-bar">
      <div className="ql-inner">
        <span style={{fontSize:10,color:"#334155",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em"}}>Quick Links:</span>
        <a href={CFG.zoho} target="_blank" rel="noreferrer" className="ql-tag" style={{background:"rgba(14,165,233,0.08)",border:"1px solid rgba(14,165,233,0.2)",color:AC2}}>📊 Invoices &amp; Quotes</a>
        <a href={CFG.adWin} target="_blank" rel="noreferrer" className="ql-tag" style={{background:"rgba(0,200,150,0.07)",border:"1px solid rgba(0,200,150,0.2)",color:AC}}>🖥️ AnyDesk (Windows)</a>
        <a href={CFG.adMac} target="_blank" rel="noreferrer" className="ql-tag" style={{background:"rgba(0,200,150,0.07)",border:"1px solid rgba(0,200,150,0.2)",color:AC}}>🍎 AnyDesk (macOS)</a>
        <a href={CFG.adAndroid} target="_blank" rel="noreferrer" className="ql-tag" style={{background:"rgba(0,200,150,0.07)",border:"1px solid rgba(0,200,150,0.2)",color:AC}}>📱 AnyDesk (Android)</a>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════
   TICKET FORM (shared between Customer + Engineer)
════════════════════════════════════════════════════ */
function TicketForm({mode,onSubmit,saving,onBack}){
  // mode: "customer" | "engineer"
  const isEng=mode==="engineer";
  const [svc,setSvc]=useState("");
  const [f,setF]=useState({
    // contact
    clientName:"",company:"",phone:"",email:"",address:"",
    // device (device booking only)
    deviceType:"",manufacturer:"",modelNumber:"",serialNumber:"",operatingSystem:"",warrantyStatus:"Unknown",
    // issue
    issueTitle:"",issueDetail:"",
    problemDescription:"",accessories:"",
    urgency:"Standard (3–5 days)",conditionOnArrival:"Good – No visible damage",
    physicalDamage:"",devicePassword:"",
    // meta
    priority:"Medium",contactMethod:"whatsapp",
    preferredDate:"",preferredTime:"",
    // engineer extras
    engineerName:"",engineerNote:"",
    authorized:false,
  });
  const [photos,setPhotos]=useState([]);
  const [err,setErr]=useState({});
  const [step,setStep]=useState(1); // 1=service, 2=details, 3=review
  const fRef=useRef();
  const set=(k,v)=>setF(p=>({...p,[k]:v}));

  const addPhotos=e=>{
    const files=Array.from(e.target.files||[]);
    Promise.all(files.slice(0,5-photos.length).map(f=>new Promise(r=>{const rd=new FileReader();rd.onload=()=>r({name:f.name,src:rd.result});rd.readAsDataURL(f);})))
      .then(imgs=>setPhotos(p=>[...p,...imgs].slice(0,5)));
  };
  const onDrop=e=>{
    e.preventDefault();
    const files=Array.from(e.dataTransfer.files||[]).filter(f=>f.type.startsWith("image/"));
    Promise.all(files.slice(0,5-photos.length).map(f=>new Promise(r=>{const rd=new FileReader();rd.onload=()=>r({name:f.name,src:rd.result});rd.readAsDataURL(f);})))
      .then(imgs=>setPhotos(p=>[...p,...imgs].slice(0,5)));
  };

  const validate=()=>{
    const e={};
    if(!f.clientName.trim()) e.clientName="Required";
    if(!f.phone.trim())      e.phone="Required";
    if(!svc)                 e.svc="Please select a service type";
    if(svc==="device"){
      if(!f.deviceType)          e.deviceType="Required";
      if(!f.manufacturer.trim()) e.manufacturer="Required";
      if(!f.problemDescription.trim()) e.problemDescription="Required";
      if(!f.authorized && !isEng) e.authorized="Authorization required";
    } else {
      if(!f.issueTitle.trim()) e.issueTitle="Required";
    }
    if(isEng && !f.engineerName.trim()) e.engineerName="Required";
    setErr(e);return!Object.keys(e).length;
  };

  const handleSubmit=()=>{
    if(!validate())return;
    onSubmit({...f,serviceType:svc,photos:photos.map(p=>p.name),loggedBy:isEng?"engineer":"customer"});
  };

  // Build WA preview for review step
  const previewTicket={
    ref:"CIM-XXXX",clientName:f.clientName||"Customer",name:f.clientName,
    phone:f.phone,email:f.email,company:f.company,priority:f.priority,
    serviceType:svc,issueTitle:f.issueTitle,problemDescription:f.problemDescription,
    issueDetail:f.issueDetail,deviceType:f.deviceType,manufacturer:f.manufacturer,
    modelNumber:f.modelNumber,serialNumber:f.serialNumber,address:f.address,
    devicePassword:f.devicePassword,loggedBy:isEng?"engineer":"customer",
    createdAt:new Date().toISOString(),
  };

  return(
    <div style={{minHeight:"100vh",background:"#050810"}}>
      <PortalHeader onAdminClick={()=>{}}/>
      {!isEng&&<QLBar/>}

      <div className="portal-main">
        {/* Page hero */}
        <div style={{marginBottom:28}} className="fu">
          <div style={{display:"inline-flex",alignItems:"center",gap:7,background:"rgba(0,200,150,0.08)",border:"1px solid rgba(0,200,150,0.2)",borderRadius:20,padding:"5px 14px",marginBottom:12}}>
            <span style={{width:5,height:5,borderRadius:"50%",background:AC,display:"inline-block"}}/>
            <span style={{fontSize:11,fontWeight:700,color:AC,textTransform:"uppercase",letterSpacing:"0.08em"}}>
              {isEng?"Engineer — Log on Behalf of Customer":"Support Centre"}
            </span>
          </div>
          <h1 style={{fontSize:32,fontWeight:800,letterSpacing:"-0.03em",color:"#F1F5F9",marginBottom:6,lineHeight:1.2}}>
            {isEng?"Create Customer Ticket":"Log a Support Ticket"}
          </h1>
          <p style={{color:"#475569",fontSize:14}}>
            {isEng
              ? "Fill in the customer's details. A WhatsApp confirmation will be sent to them automatically."
              : "We'll reach out via WhatsApp or Email — your choice."}
          </p>
        </div>

        {/* AnyDesk / Zoho callouts for customer mode */}
        {!isEng&&(
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:24}}>
            <div style={{background:"linear-gradient(135deg,rgba(0,200,150,0.05),rgba(14,165,233,0.05))",border:"1px solid #0F1C2E",borderRadius:10,padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontSize:22}}>🖥️</span>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:700,color:"#E2E8F0",marginBottom:2}}>Remote Support?</div>
                <div style={{fontSize:11,color:"#475569"}}>Download AnyDesk first.</div>
              </div>
              <div style={{display:"flex",gap:5}}>
                <a href={CFG.adWin} target="_blank" rel="noreferrer" style={{fontSize:10,fontWeight:700,color:AC,background:"rgba(0,200,150,0.1)",border:"1px solid rgba(0,200,150,0.2)",borderRadius:5,padding:"4px 8px"}}>Win</a>
                <a href={CFG.adMac} target="_blank" rel="noreferrer" style={{fontSize:10,fontWeight:700,color:AC,background:"rgba(0,200,150,0.1)",border:"1px solid rgba(0,200,150,0.2)",borderRadius:5,padding:"4px 8px"}}>Mac</a>
              </div>
            </div>
            <div style={{background:"rgba(14,165,233,0.05)",border:"1px solid rgba(14,165,233,0.2)",borderRadius:10,padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontSize:22}}>📊</span>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:700,color:"#E2E8F0",marginBottom:2}}>Invoices &amp; Quotes</div>
                <div style={{fontSize:11,color:"#475569"}}>View your billing history.</div>
              </div>
              <a href={CFG.zoho} target="_blank" rel="noreferrer" style={{fontSize:11,fontWeight:700,color:"#fff",background:AC2,borderRadius:6,padding:"6px 10px",whiteSpace:"nowrap"}}>Open →</a>
            </div>
          </div>
        )}

        {/* Step indicator */}
        <div style={{display:"flex",alignItems:"center",gap:0,marginBottom:24}}>
          {["Service","Details","Review"].map((s,i)=>(
            <React.Fragment key={i}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:26,height:26,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,fontFamily:"'IBM Plex Mono',monospace",border:`2px solid ${step>=i+1?AC:"#1E2A3A"}`,background:step>i?AC:"transparent",color:step>i?"#050810":step===i+1?AC:"#334155",transition:"all 0.25s",flexShrink:0}}>{step>i?"✓":i+1}</div>
                <span style={{fontSize:12,fontWeight:600,color:step>=i+1?"#CBD5E1":"#334155",whiteSpace:"nowrap"}}>{s}</span>
              </div>
              {i<2&&<div style={{flex:1,height:1,background:step>i+1?AC:"#1E2A3A",margin:"0 10px",transition:"all 0.25s",minWidth:20}}/>}
            </React.Fragment>
          ))}
        </div>

        {/* ── STEP 1: Service type ── */}
        {step===1&&(
          <div className="card fu">
            <div className="card-header"><div className="card-title">What type of support is needed?</div></div>
            <div className="card-body">
              {err.svc&&<div style={{color:"#F87171",fontSize:12,marginBottom:12}}>{err.svc}</div>}
              <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
                {SVCS.map(sv=>(
                  <button key={sv.id} onClick={()=>setSvc(sv.id)}
                    style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px",borderRadius:10,border:`2px solid ${svc===sv.id?AC:"#0F1C2E"}`,background:svc===sv.id?"rgba(0,200,150,0.06)":"#050810",cursor:"pointer",textAlign:"left",fontFamily:"inherit",position:"relative",transition:"all 0.2s"}}>
                    <span style={{fontSize:24,flexShrink:0}}>{sv.icon}</span>
                    <div>
                      <div style={{fontSize:14,fontWeight:600,color:"#E2E8F0",marginBottom:2}}>{sv.label}</div>
                      <div style={{fontSize:11,color:"#475569"}}>
                        {sv.id==="device"&&"Hand in a device for diagnosis & repair"}
                        {sv.id==="remote"&&"Remote screen share / desktop assistance"}
                        {sv.id==="onsite"&&"Engineer visits your premises"}
                      </div>
                    </div>
                    {svc===sv.id&&<span style={{position:"absolute",right:14,color:AC,fontSize:18,fontWeight:700}}>✓</span>}
                    {sv.id==="device"&&svc!==sv.id&&<span style={{position:"absolute",right:14,fontSize:10,fontWeight:700,color:AC,background:"rgba(0,200,150,0.1)",border:"1px solid rgba(0,200,150,0.2)",borderRadius:5,padding:"2px 7px"}}>Full Form</span>}
                  </button>
                ))}
              </div>
              <div style={{display:"flex",justifyContent:"flex-end"}}>
                <button className="btn btn-primary" onClick={()=>{if(!svc){setErr({svc:"Please select a service"});}else{setErr({});setStep(2);}}} disabled={!svc}>Continue →</button>
              </div>
            </div>
          </div>
        )}

        {/* ── STEP 2: Details ── */}
        {step===2&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}} className="fu">

            {/* Engineer info section */}
            {isEng&&(
              <div className="card">
                <div className="card-header"><div className="card-title" style={{color:AC}}>👷 Engineer Information</div></div>
                <div className="card-body">
                  <div className="form-grid">
                    <Field l="Engineer Name *" e={err.engineerName}>
                      <input {...fi} value={f.engineerName} onChange={e=>set("engineerName",e.target.value)} placeholder="Your name"/>
                    </Field>
                    <Field l="Internal Note (optional)">
                      <input {...fi} value={f.engineerNote} onChange={e=>set("engineerNote",e.target.value)} placeholder="Context for the team"/>
                    </Field>
                  </div>
                </div>
              </div>
            )}

            {/* Contact info */}
            <div className="card">
              <div className="card-header"><div className="card-title">Contact Information</div></div>
              <div className="card-body">
                <div className="form-grid">
                  <Field l="Company">
                    <input {...fi} value={f.company} onChange={e=>set("company",e.target.value)} placeholder="Company name (if applicable)"/>
                  </Field>
                  <Field l="Full Name *" e={err.clientName}>
                    <input {...fi} value={f.clientName} onChange={e=>set("clientName",e.target.value)} placeholder="John Doe"/>
                  </Field>
                  <Field l="Phone / WhatsApp *" e={err.phone}>
                    <input {...fi} value={f.phone} onChange={e=>set("phone",e.target.value)} placeholder="+27 72 665 0565"/>
                  </Field>
                  <Field l="Email Address">
                    <input {...fi} type="email" value={f.email} onChange={e=>set("email",e.target.value)} placeholder="john@example.com"/>
                  </Field>
                  {svc==="onsite"&&<Field l="Address" span>
                    <input {...fi} value={f.address} onChange={e=>set("address",e.target.value)} placeholder="123 Main St, Sandton"/>
                  </Field>}
                  {svc==="onsite"&&<>
                    <Field l="Preferred Date"><input {...fi} type="date" value={f.preferredDate} onChange={e=>set("preferredDate",e.target.value)}/></Field>
                    <Field l="Preferred Time"><input {...fi} type="time" value={f.preferredTime} onChange={e=>set("preferredTime",e.target.value)}/></Field>
                  </>}
                </div>
              </div>
            </div>

            {/* Device-specific fields */}
            {svc==="device"&&(
              <div className="card">
                <div className="card-header"><div className="card-title">Device Information</div></div>
                <div className="card-body">
                  <div className="form-grid">
                    <Field l="Device Type *" e={err.deviceType}>
                      <select {...fi} value={f.deviceType} onChange={e=>set("deviceType",e.target.value)}>
                        <option value="">Select type…</option>
                        {DEVT.map(d=><option key={d}>{d}</option>)}
                      </select>
                    </Field>
                    <Field l="Manufacturer *" e={err.manufacturer}>
                      <input {...fi} value={f.manufacturer} onChange={e=>set("manufacturer",e.target.value)} placeholder="Dell, Apple, HP, Lenovo…"/>
                    </Field>
                    <Field l="Model Number" span>
                      <input {...fi} value={f.modelNumber} onChange={e=>set("modelNumber",e.target.value)} placeholder="MacBook Pro 13″ A2251 / ThinkPad X1 Carbon…"/>
                    </Field>
                    <Field l="Serial Number / Service Tag">
                      <input {...fi} value={f.serialNumber} onChange={e=>set("serialNumber",e.target.value)} placeholder="SN-XXXXXXX"/>
                    </Field>
                    <Field l="Operating System / Version">
                      <input {...fi} value={f.operatingSystem} onChange={e=>set("operatingSystem",e.target.value)} placeholder="Windows 11 Pro / macOS Sonoma 14.5…"/>
                    </Field>
                    <Field l="Warranty Status" span>
                      <div className="radio-chips">{WARR.map(w=><div key={w} className={`chip${f.warrantyStatus===w?" active":""}`} onClick={()=>set("warrantyStatus",w)}>{w}</div>)}</div>
                    </Field>
                  </div>
                </div>
              </div>
            )}

            {/* Problem */}
            <div className="card">
              <div className="card-header"><div className="card-title">Problem Details</div></div>
              <div className="card-body">
                <div className="form-grid">
                  {svc==="device"?(
                    <>
                      <Field l="Problem Description *" e={err.problemDescription} span>
                        <textarea {...fi} value={f.problemDescription} onChange={e=>set("problemDescription",e.target.value)} placeholder="Describe the fault — error messages, symptoms, when it started…"/>
                      </Field>
                      <Field l="Accessories Supplied" span>
                        <input {...fi} value={f.accessories} onChange={e=>set("accessories",e.target.value)} placeholder="Charger, mouse, bag — or 'None'"/>
                      </Field>
                      <Field l="Urgency">
                        <select {...fi} value={f.urgency} onChange={e=>set("urgency",e.target.value)}>{URG.map(u=><option key={u}>{u}</option>)}</select>
                      </Field>
                      <Field l="Condition on Arrival">
                        <select {...fi} value={f.conditionOnArrival} onChange={e=>set("conditionOnArrival",e.target.value)}>{COND.map(c=><option key={c}>{c}</option>)}</select>
                      </Field>
                      <Field l="Physical Damage Noted">
                        <input {...fi} value={f.physicalDamage} onChange={e=>set("physicalDamage",e.target.value)} placeholder="Describe visible damage, or 'None'"/>
                      </Field>
                      <Field l="Device Password">
                        <input {...fi} value={f.devicePassword} onChange={e=>set("devicePassword",e.target.value)} placeholder="Leave blank if not needed"/>
                      </Field>
                      {/* Photo upload */}
                      <Field l="Device Photos (max 5)" span>
                        <div className={`photo-drop${photos.length>0?" has-photos":""}`} onDrop={onDrop} onDragOver={e=>e.preventDefault()} onClick={()=>fRef.current&&fRef.current.click()}>
                          <input ref={fRef} type="file" accept="image/*" multiple onChange={addPhotos}/>
                          {photos.length===0?(
                            <><div style={{fontSize:26,marginBottom:6}}>📷</div>
                            <div style={{fontSize:13,color:"#475569",marginBottom:3}}>Drag &amp; drop or click to browse</div>
                            <div style={{fontSize:11,color:"#334155"}}>JPG, PNG, HEIC — up to 5 photos</div></>
                          ):(
                            <div className="photo-grid">
                              {photos.map((p,i)=><div key={i} className="photo-thumb"><img src={p.src} alt=""/><button className="photo-rm" onClick={ev=>{ev.stopPropagation();setPhotos(ph=>ph.filter((_,j)=>j!==i));}}>×</button></div>)}
                              {photos.length<5&&<div style={{width:72,height:72,border:"2px dashed #1E2A3A",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",color:"#334155",fontSize:22}}>+</div>}
                            </div>
                          )}
                        </div>
                      </Field>
                    </>
                  ):(
                    <>
                      <Field l="Issue Title *" e={err.issueTitle} span>
                        <input {...fi} value={f.issueTitle} onChange={e=>set("issueTitle",e.target.value)} placeholder="e.g. Laptop won't turn on, WiFi keeps dropping…"/>
                      </Field>
                      <Field l="More Details (optional)" span>
                        <textarea {...fi} value={f.issueDetail} onChange={e=>set("issueDetail",e.target.value)} placeholder="Error messages, when it started, anything helpful…"/>
                      </Field>
                    </>
                  )}
                  <Field l="Priority">
                    <select {...fi} value={f.priority} onChange={e=>set("priority",e.target.value)}>{PRIS.map(p=><option key={p}>{p}</option>)}</select>
                  </Field>
                  {!isEng&&<Field l="Preferred Contact">
                    <div className="radio-chips">
                      {[{v:"whatsapp",l:"📱 WhatsApp"},{v:"email",l:"✉️ Email"},{v:"both",l:"🔔 Both"}].map(o=>(
                        <div key={o.v} className={`chip${f.contactMethod===o.v?" active":""}`} onClick={()=>set("contactMethod",o.v)}>{o.l}</div>
                      ))}
                    </div>
                  </Field>}
                </div>
              </div>
            </div>

            {/* Authorization for device (non-engineer) */}
            {svc==="device"&&!isEng&&(
              <div className="card" style={{border:`1px solid ${err.authorized?"rgba(248,113,113,0.3)":"#0F1C2E"}`}}>
                <div className="card-body">
                  <div style={{background:"#050810",borderRadius:8,padding:12,marginBottom:12,border:"1px solid #0A1525"}}>
                    <p style={{fontSize:12,color:"#64748B",lineHeight:1.7}}>
                      I authorize <strong style={{color:"#CBD5E1"}}>{CFG.bizName}</strong> to diagnose and repair the device described above. I understand that I am responsible for the backup of my data.
                    </p>
                  </div>
                  <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer"}} onClick={()=>set("authorized",!f.authorized)}>
                    <div style={{width:20,height:20,borderRadius:5,border:`2px solid ${f.authorized?AC:"#334155"}`,background:f.authorized?AC:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1,transition:"all 0.2s"}}>
                      {f.authorized&&<span style={{color:"#050810",fontSize:13,fontWeight:700}}>✓</span>}
                    </div>
                    <span style={{fontSize:13,color:"#94A3B8",lineHeight:1.6}}>I agree to the authorization &amp; terms of service.</span>
                  </label>
                  {err.authorized&&<div className="field-error" style={{marginTop:8}}>{err.authorized}</div>}
                </div>
              </div>
            )}

            <div style={{display:"flex",justifyContent:"space-between",gap:10}}>
              <button className="btn btn-secondary" onClick={()=>{setErr({});setStep(1);}}>← Back</button>
              <button className="btn btn-primary" onClick={()=>{if(validate())setStep(3);}}>Review Ticket →</button>
            </div>
          </div>
        )}

        {/* ── STEP 3: Review + WA preview ── */}
        {step===3&&(
          <div style={{display:"flex",flexDirection:"column",gap:14}} className="fu">

            {/* Summary card */}
            <div className="card">
              <div className="card-header">
                <div className="card-title">Ticket Summary</div>
                <button className="btn btn-ghost btn-sm" onClick={()=>setStep(2)}>Edit</button>
              </div>
              <div style={{overflow:"hidden"}}>
                {[
                  ["Service",    SVCS.find(s=>s.id===svc)?.label],
                  ["Name",       f.clientName],
                  ["Phone",      f.phone],
                  f.email&&["Email",f.email],
                  f.company&&["Company",f.company],
                  f.address&&["Address",f.address],
                  f.preferredDate&&["Preferred",`${f.preferredDate} ${f.preferredTime}`],
                  f.deviceType&&["Device",`${f.manufacturer} ${f.modelNumber} (${f.deviceType})`],
                  f.serialNumber&&["Serial",f.serialNumber],
                  ["Issue",      f.issueTitle||f.problemDescription||"—"],
                  f.issueDetail&&["Details",f.issueDetail],
                  ["Priority",   f.priority],
                  !isEng&&["Contact via",f.contactMethod],
                  isEng&&["Logged by", `Engineer: ${f.engineerName}`],
                ].filter(Boolean).map(([l,v],i)=>(
                  <div key={i} className="detail-row" style={{padding:"8px 20px"}}>
                    <div className="detail-key">{l}</div>
                    <div className="detail-val">{v}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* WA preview */}
            <div className="card">
              <div className="card-header">
                <div className="card-title">📱 WhatsApp Messages Preview</div>
                <span style={{fontSize:11,color:"#475569"}}>Sent automatically on submit</span>
              </div>
              <div className="card-body" style={{display:"flex",flexDirection:"column",gap:14}}>
                <div>
                  <div style={{fontSize:11,fontWeight:700,color:AC,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>→ To Customer ({f.phone||"customer phone"})</div>
                  <div className="wa-preview"><div className="wa-bubble">{buildCustomerMsg(previewTicket)}</div></div>
                </div>
                <div className="divider"/>
                <div>
                  <div style={{fontSize:11,fontWeight:700,color:AC2,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>→ To {CFG.bizName} (reference copy)</div>
                  <div className="wa-preview" style={{background:"#0A1020",borderColor:"rgba(14,165,233,0.2)"}}><div className="wa-bubble" style={{background:"#112030",color:"#BAE6FD"}}>{buildBusinessMsg(previewTicket)}</div></div>
                </div>
              </div>
            </div>

            <div style={{display:"flex",gap:10,justifyContent:"space-between",flexWrap:"wrap"}}>
              <button className="btn btn-secondary" onClick={()=>setStep(2)}>← Back</button>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <a href={waUrl(f.phone,buildCustomerMsg(previewTicket))} target="_blank" rel="noreferrer" className="btn btn-wa">💬 Preview Customer WA</a>
                <button className="btn btn-primary" onClick={handleSubmit} disabled={saving} style={{minWidth:200}}>
                  {saving?"⏳ Saving to Firebase…":"🚀 Submit & Send WhatsApp"}
                </button>
              </div>
            </div>

/* ════════════════════════════════════════════════════
   ROOT APP
════════════════════════════════════════════════════ */
function App(){
  const [view,setView]=useState("portal"); // portal | admin | success
  const [tickets,setTickets]=useState([]);
  const [dbLoading,setDbLoading]=useState(true);
  const [lastTicket,setLastTicket]=useState(null);
  const [adminAuthed,setAdminAuthed]=useState(false);
  const [saving,setSaving]=useState(false);
  const [toast,setToast]=useState({msg:"",type:"ok"});

  const showToast=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast({msg:"",type:"ok"}),3000);};

  /* Real-time listener */
  useEffect(()=>{
    const unsub=db.collection("tickets").orderBy("createdAt","desc")
      .onSnapshot(snap=>{setTickets(snap.docs.map(d=>({id:d.id,...d.data()})));setDbLoading(false);},
      err=>{console.error(err);setDbLoading(false);showToast("Firebase error","error");});
    return()=>unsub();
  },[]);

  /* Add ticket */
  const addTicket=async(form)=>{
    setSaving(true);
    try{
      const num=await nextTicketNumber();
      const ref=makeTktRef(num);
      const ticket={
        ...form,ref,ticketNumber:num,
        status:"open",
        createdAt:ts(),updatedAt:ts(),
        notes:[],quotationRef:"",
      };
      await fsAdd(ticket);
      setLastTicket(ticket);
      setView("success");
      showToast(`Ticket ${ref} created ✓`);
    }catch(e){console.error(e);showToast("Failed to save ticket","error");}
    setSaving(false);
  };

  const updateTicket=async(ref,changes)=>{
    try{await fsUpdate(ref,changes);showToast("Updated ✓");}
    catch(e){console.error(e);showToast("Update failed","error");}
  };

  const addNote=async(ref,txt)=>{
    try{await fsNote(ref,txt);showToast("Note added ✓");}
    catch(e){console.error(e);showToast("Note failed","error");}
  };

  if(dbLoading)return<Spinner/>;

  return(
    <>
      {view==="portal"  && <TicketForm mode="customer" onSubmit={addTicket} saving={saving} onBack={()=>setView("portal")}/>}
      {view==="success" && lastTicket && <SuccessScreen ticket={lastTicket} onBack={()=>setView("portal")}/>}
      {view==="admin"   && <Admin tickets={tickets} loading={dbLoading} authed={adminAuthed} onAuth={()=>setAdminAuthed(true)} onUpdate={updateTicket} onAddNote={addNote} onBack={()=>setView("portal")} onNewTicket={addTicket}/>}

      {/* Admin button visible on portal */}
      {view==="portal"&&(
        <button onClick={()=>setView("admin")}
          style={{position:"fixed",bottom:20,right:20,background:`linear-gradient(135deg,${AC},${AC2})`,color:"#050810",border:"none",borderRadius:10,padding:"10px 18px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",zIndex:100,boxShadow:"0 4px 20px rgba(0,200,150,0.3)"}}>
          🔐 Admin
        </button>
      )}

      <Toast msg={toast.msg} type={toast.type}/>
    </>
  );
}

// Override portal's "Admin →" button to route correctly
// (PortalHeader gets onAdminClick from parent via context trick)
// We re-render the whole portal passing correct handler via prop override
function Root(){
  const [view,setView]=useState("portal");
  const [tickets,setTickets]=useState([]);
  const [dbLoading,setDbLoading]=useState(true);
  const [lastTicket,setLastTicket]=useState(null);
  const [adminAuthed,setAdminAuthed]=useState(false);
  const [saving,setSaving]=useState(false);
  const [toast,setToast]=useState({msg:"",type:"ok"});

  const showToast=(msg,type="ok")=>{setToast({msg,type});setTimeout(()=>setToast({msg:"",type:"ok"}),3000);};

  useEffect(()=>{
    const unsub=db.collection("tickets").orderBy("createdAt","desc")
      .onSnapshot(snap=>{setTickets(snap.docs.map(d=>({id:d.id,...d.data()})));setDbLoading(false);},
      err=>{console.error(err);setDbLoading(false);showToast("Firebase error","error");});
    return()=>unsub();
  },[]);

  const addTicket=async(form)=>{
    setSaving(true);
    try{
      const num=await nextTicketNumber();
      const ref=makeTktRef(num);
      const ticket={...form,ref,ticketNumber:num,status:"open",createdAt:ts(),updatedAt:ts(),notes:[],quotationRef:""};
      await fsAdd(ticket);
      setLastTicket(ticket);
      if(view==="admin")showToast(`Ticket ${ref} created ✓`);
      else setView("success");
    }catch(e){console.error(e);showToast("Failed to save ticket","error");}
    setSaving(false);
  };

  const updateTicket=async(ref,changes)=>{try{await fsUpdate(ref,changes);showToast("Updated ✓");}catch(e){console.error(e);showToast("Update failed","error");}};
  const addNote=async(ref,txt)=>{try{await fsNote(ref,txt);showToast("Note added ✓");}catch(e){console.error(e);showToast("Note failed","error");}};

  if(dbLoading)return<Spinner/>;

  // Patch PortalHeader's admin click — we wrap it using a small context hack
  // Instead: render custom portal wrapper that injects the handler
  const CustomerPortalPage=()=>(
    <div style={{minHeight:"100vh",background:"#050810"}}>
      {/* Reuse PortalHeader with real handler */}
      <header className="portal-header">
        <div className="portal-header-inner">
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:34,height:34,borderRadius:9,background:`linear-gradient(135deg,${AC},${AC2})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>⚡</div>
            <div>
              <div style={{fontSize:15,fontWeight:700,color:"#F1F5F9",letterSpacing:"-0.01em"}}>{CFG.bizName}</div>
              <div style={{fontSize:10,color:"#475569",fontWeight:500,letterSpacing:"0.05em",textTransform:"uppercase"}}>{CFG.tagline}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <a href={CFG.zoho} target="_blank" rel="noreferrer" className="btn btn-secondary btn-sm">📊 Zoho Portal</a>
            <button onClick={()=>setView("admin")} className="btn btn-sm" style={{background:`rgba(0,200,150,0.1)`,border:`1px solid ${AC}44`,color:AC}}>Admin →</button>
          </div>
        </div>
      </header>
      <QLBar/>
      {/* Inner form without its own header */}
      <TicketFormInner saving={saving} onSubmit={addTicket}/>
    </div>
  );

  return(
    <>
      {view==="portal"  && <CustomerPortalPage/>}
      {view==="success" && lastTicket && <SuccessScreen ticket={lastTicket} onBack={()=>setView("portal")}/>}
      {view==="admin"   && <Admin tickets={tickets} loading={dbLoading} authed={adminAuthed} onAuth={()=>setAdminAuthed(true)} onUpdate={updateTicket} onAddNote={addNote} onBack={()=>setView("portal")} onNewTicket={addTicket}/>}
      <Toast msg={toast.msg} type={toast.type}/>
    </>
  );
}

/* ── INNER FORM (no header, used in portal wrapper) ── */
function TicketFormInner({onSubmit,saving}){
  const [svc,setSvc]=useState("");
  const [step,setStep]=useState(1);
  const [f,setF]=useState({clientName:"",company:"",phone:"",email:"",address:"",deviceType:"",manufacturer:"",modelNumber:"",serialNumber:"",operatingSystem:"",warrantyStatus:"Unknown",issueTitle:"",issueDetail:"",problemDescription:"",accessories:"",urgency:"Standard (3–5 days)",conditionOnArrival:"Good – No visible damage",physicalDamage:"",devicePassword:"",priority:"Medium",contactMethod:"whatsapp",preferredDate:"",preferredTime:"",authorized:false});
  const [photos,setPhotos]=useState([]);
  const [err,setErr]=useState({});
  const fRef=useRef();
  const set=(k,v)=>setF(p=>({...p,[k]:v}));

  const addPhotos=e=>{const files=Array.from(e.target.files||[]);Promise.all(files.slice(0,5-photos.length).map(file=>new Promise(r=>{const rd=new FileReader();rd.onload=()=>r({name:file.name,src:rd.result});rd.readAsDataURL(file);}))).then(imgs=>setPhotos(p=>[...p,...imgs].slice(0,5)));};
  const onDrop=e=>{e.preventDefault();const files=Array.from(e.dataTransfer.files||[]).filter(f=>f.type.startsWith("image/"));Promise.all(files.slice(0,5-photos.length).map(file=>new Promise(r=>{const rd=new FileReader();rd.onload=()=>r({name:file.name,src:rd.result});rd.readAsDataURL(file);}))).then(imgs=>setPhotos(p=>[...p,...imgs].slice(0,5)));};

  const validate=()=>{
    const e={};
    if(!svc) e.svc="Select a service";
    if(!f.clientName.trim()) e.clientName="Required";
    if(!f.phone.trim()) e.phone="Required";
    if(svc==="device"){if(!f.deviceType)e.deviceType="Required";if(!f.manufacturer.trim())e.manufacturer="Required";if(!f.problemDescription.trim())e.problemDescription="Required";if(!f.authorized)e.authorized="Required";}
    else{if(!f.issueTitle.trim())e.issueTitle="Required";}
    setErr(e);return!Object.keys(e).length;
  };

  const previewT={ref:"CIM-XXXX",clientName:f.clientName||"Customer",name:f.clientName,phone:f.phone,email:f.email,company:f.company,priority:f.priority,serviceType:svc,issueTitle:f.issueTitle,problemDescription:f.problemDescription,issueDetail:f.issueDetail,deviceType:f.deviceType,manufacturer:f.manufacturer,modelNumber:f.modelNumber,serialNumber:f.serialNumber,address:f.address,devicePassword:f.devicePassword,loggedBy:"customer",createdAt:new Date().toISOString()};

  return(
    <div className="portal-main">
      {/* Hero */}
      <div style={{marginBottom:28,textAlign:"center"}} className="fu">
        <div style={{display:"inline-flex",alignItems:"center",gap:7,background:"rgba(0,200,150,0.08)",border:"1px solid rgba(0,200,150,0.2)",borderRadius:20,padding:"5px 14px",marginBottom:12}}>
          <span style={{width:5,height:5,borderRadius:"50%",background:AC,display:"inline-block"}}/>
          <span style={{fontSize:11,fontWeight:700,color:AC,textTransform:"uppercase",letterSpacing:"0.08em"}}>Support Centre</span>
        </div>
        <h1 style={{fontSize:32,fontWeight:800,letterSpacing:"-0.03em",color:"#F1F5F9",marginBottom:6}}>Log a Support Ticket</h1>
        <p style={{color:"#475569",fontSize:14}}>We'll reach out via WhatsApp or Email — your choice.</p>
      </div>

      {/* Callouts */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:24}}>
        <div style={{background:"linear-gradient(135deg,rgba(0,200,150,0.05),rgba(14,165,233,0.05))",border:"1px solid #0F1C2E",borderRadius:10,padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:22}}>🖥️</span>
          <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:"#E2E8F0",marginBottom:2}}>Remote Support?</div><div style={{fontSize:11,color:"#475569"}}>Download AnyDesk first.</div></div>
          <div style={{display:"flex",gap:5}}>
            <a href={CFG.adWin} target="_blank" rel="noreferrer" style={{fontSize:10,fontWeight:700,color:AC,background:"rgba(0,200,150,0.1)",border:"1px solid rgba(0,200,150,0.2)",borderRadius:5,padding:"4px 8px"}}>Win</a>
            <a href={CFG.adMac} target="_blank" rel="noreferrer" style={{fontSize:10,fontWeight:700,color:AC,background:"rgba(0,200,150,0.1)",border:"1px solid rgba(0,200,150,0.2)",borderRadius:5,padding:"4px 8px"}}>Mac</a>
          </div>
        </div>
        <div style={{background:"rgba(14,165,233,0.05)",border:"1px solid rgba(14,165,233,0.2)",borderRadius:10,padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:22}}>📊</span>
          <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:"#E2E8F0",marginBottom:2}}>Invoices &amp; Quotes</div><div style={{fontSize:11,color:"#475569"}}>View your billing history.</div></div>
          <a href={CFG.zoho} target="_blank" rel="noreferrer" style={{fontSize:11,fontWeight:700,color:"#fff",background:AC2,borderRadius:6,padding:"6px 10px",whiteSpace:"nowrap"}}>Open →</a>
        </div>
      </div>

      {/* Steps */}
      <div style={{display:"flex",alignItems:"center",gap:0,marginBottom:24}}>
        {["Service","Details","Review"].map((s,i)=>(
          <React.Fragment key={i}>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <div style={{width:26,height:26,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,fontFamily:"'IBM Plex Mono',monospace",border:`2px solid ${step>=i+1?AC:"#1E2A3A"}`,background:step>i?AC:"transparent",color:step>i?"#050810":step===i+1?AC:"#334155",transition:"all 0.25s",flexShrink:0}}>{step>i?"✓":i+1}</div>
              <span style={{fontSize:12,fontWeight:600,color:step>=i+1?"#CBD5E1":"#334155",whiteSpace:"nowrap"}}>{s}</span>
            </div>
            {i<2&&<div style={{flex:1,height:1,background:step>i+1?AC:"#1E2A3A",margin:"0 10px",transition:"all 0.25s",minWidth:20}}/>}
          </React.Fragment>
        ))}
      </div>

      {/* Step 1 */}
      {step===1&&(
        <div className="card fu">
          <div className="card-header"><div className="card-title">What type of support is needed?</div></div>
          <div className="card-body">
            {err.svc&&<div style={{color:"#F87171",fontSize:12,marginBottom:10}}>{err.svc}</div>}
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
              {SVCS.map(sv=>(
                <button key={sv.id} onClick={()=>setSvc(sv.id)}
                  style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px",borderRadius:10,border:`2px solid ${svc===sv.id?AC:"#0F1C2E"}`,background:svc===sv.id?"rgba(0,200,150,0.06)":"#050810",cursor:"pointer",textAlign:"left",fontFamily:"inherit",position:"relative",transition:"all 0.2s"}}>
                  <span style={{fontSize:24,flexShrink:0}}>{sv.icon}</span>
                  <div>
                    <div style={{fontSize:14,fontWeight:600,color:"#E2E8F0",marginBottom:2}}>{sv.label}</div>
                    <div style={{fontSize:11,color:"#475569"}}>
                      {sv.id==="device"&&"Hand in a device for diagnosis & repair"}
                      {sv.id==="remote"&&"Remote screen share / desktop assistance"}
                      {sv.id==="onsite"&&"Engineer visits your premises"}

                  </div>
                  {svc===sv.id&&<span style={{position:"absolute",right:14,color:AC,fontSize:18,fontWeight:700}}>✓</span>}
                </button>

            </div>
            <div style={{display:"flex",justifyContent:"flex-end"}}>
              <button className="btn btn-primary" onClick={()=>{if(!svc){setErr({svc:"Please select a service"});}else{setErr({});setStep(2);}}} disabled={!svc}>Continue →</button>
            </div>
          </div>
        </div>
      )}

      {/* Step 2 */}
      {step===2&&(
        <div style={{display:"flex",flexDirection:"column",gap:14}} className="fu">
          <div className="card">
            <div className="card-header"><div className="card-title">Contact Information</div></div>
            <div className="card-body">
              <div className="form-grid">
                <Field l="Company"><input {...fi} value={f.company} onChange={e=>set("company",e.target.value)} placeholder="Company name"/></Field>
                <Field l="Full Name *" e={err.clientName}><input {...fi} value={f.clientName} onChange={e=>set("clientName",e.target.value)} placeholder="John Doe"/></Field>
                <Field l="Phone / WhatsApp *" e={err.phone}><input {...fi} value={f.phone} onChange={e=>set("phone",e.target.value)} placeholder="+27 72 665 0565"/></Field>
                <Field l="Email Address"><input {...fi} type="email" value={f.email} onChange={e=>set("email",e.target.value)} placeholder="john@example.com"/></Field>
                {svc==="onsite"&&<Field l="Address" span><input {...fi} value={f.address} onChange={e=>set("address",e.target.value)} placeholder="123 Main St, Sandton"/></Field>}
                {svc==="onsite"&&<><Field l="Preferred Date"><input {...fi} type="date" value={f.preferredDate} onChange={e=>set("preferredDate",e.target.value)}/></Field><Field l="Preferred Time"><input {...fi} type="time" value={f.preferredTime} onChange={e=>set("preferredTime",e.target.value)}/></Field></>}
              </div>
            </div>
          </div>
          {svc==="device"&&(
            <div className="card">
              <div className="card-header"><div className="card-title">Device Information</div></div>
              <div className="card-body">
                <div className="form-grid">
                  <Field l="Device Type *" e={err.deviceType}><select {...fi} value={f.deviceType} onChange={e=>set("deviceType",e.target.value)}><option value="">Select…</option>{DEVT.map(d=><option key={d}>{d}</option>)}</select></Field>
                  <Field l="Manufacturer *" e={err.manufacturer}><input {...fi} value={f.manufacturer} onChange={e=>set("manufacturer",e.target.value)} placeholder="Dell, Apple, HP…"/></Field>
                  <Field l="Model Number" span><input {...fi} value={f.modelNumber} onChange={e=>set("modelNumber",e.target.value)} placeholder="MacBook Pro 13″ A2251…"/></Field>
                  <Field l="Serial Number"><input {...fi} value={f.serialNumber} onChange={e=>set("serialNumber",e.target.value)} placeholder="SN-XXXXXXX"/></Field>
                  <Field l="OS / Version"><input {...fi} value={f.operatingSystem} onChange={e=>set("operatingSystem",e.target.value)} placeholder="Windows 11 Pro…"/></Field>
                  <Field l="Warranty" span><div className="radio-chips">{WARR.map(w=><div key={w} className={`chip${f.warrantyStatus===w?" active":""}`} onClick={()=>set("warrantyStatus",w)}>{w}</div>)}</div></Field>
                </div>
              </div>
            </div>
          )}
          <div className="card">
            <div className="card-header"><div className="card-title">Problem Details</div></div>
            <div className="card-body">
              <div className="form-grid">
                {svc==="device"?(
                  <>
                    <Field l="Problem Description *" e={err.problemDescription} span><textarea {...fi} value={f.problemDescription} onChange={e=>set("problemDescription",e.target.value)} placeholder="Describe the fault…"/></Field>
                    <Field l="Accessories Supplied" span><input {...fi} value={f.accessories} onChange={e=>set("accessories",e.target.value)} placeholder="Charger, mouse — or 'None'"/></Field>
                    <Field l="Urgency"><select {...fi} value={f.urgency} onChange={e=>set("urgency",e.target.value)}>{URG.map(u=><option key={u}>{u}</option>)}</select></Field>
                    <Field l="Condition on Arrival"><select {...fi} value={f.conditionOnArrival} onChange={e=>set("conditionOnArrival",e.target.value)}>{COND.map(c=><option key={c}>{c}</option>)}</select></Field>
                    <Field l="Physical Damage"><input {...fi} value={f.physicalDamage} onChange={e=>set("physicalDamage",e.target.value)} placeholder="'None' or describe"/></Field>
                    <Field l="Device Password"><input {...fi} value={f.devicePassword} onChange={e=>set("devicePassword",e.target.value)} placeholder="Leave blank if not needed"/></Field>
                    <Field l="Photos (max 5)" span>
                      <div className="photo-drop" onDrop={onDrop} onDragOver={e=>e.preventDefault()} onClick={()=>fRef.current&&fRef.current.click()}>
                        <input ref={fRef} type="file" accept="image/*" multiple onChange={addPhotos}/>
                        {photos.length===0?(<><div style={{fontSize:24,marginBottom:5}}>📷</div><div style={{fontSize:12,color:"#475569"}}>Drag &amp; drop or click to browse</div></>):(
                          <div className="photo-grid">{photos.map((p,i)=><div key={i} className="photo-thumb"><img src={p.src} alt=""/><button className="photo-rm" onClick={ev=>{ev.stopPropagation();setPhotos(ph=>ph.filter((_,j)=>j!==i));}}>×</button></div>)}{photos.length<5&&<div style={{width:72,height:72,border:"2px dashed #1E2A3A",borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center",color:"#334155",fontSize:22}}>+</div>}</div>
                        )}
                      </div>
                    </Field>
                  </>
                ):(
                  <>
                    <Field l="Issue Title *" e={err.issueTitle} span><input {...fi} value={f.issueTitle} onChange={e=>set("issueTitle",e.target.value)} placeholder="e.g. Laptop won't turn on…"/></Field>
                    <Field l="More Details" span><textarea {...fi} value={f.issueDetail} onChange={e=>set("issueDetail",e.target.value)} placeholder="Error messages, anything helpful…"/></Field>
                  </>
                )}
                <Field l="Priority"><select {...fi} value={f.priority} onChange={e=>set("priority",e.target.value)}>{PRIS.map(p=><option key={p}>{p}</option>)}</select></Field>
                <Field l="Preferred Contact">
                  <div className="radio-chips">
                    {[{v:"whatsapp",l:"📱 WhatsApp"},{v:"email",l:"✉️ Email"},{v:"both",l:"🔔 Both"}].map(o=>(
                      <div key={o.v} className={`chip${f.contactMethod===o.v?" active":""}`} onClick={()=>set("contactMethod",o.v)}>{o.l}</div>
                    ))}
                  </div>
                </Field>
              </div>
            </div>
          </div>
          {svc==="device"&&(
            <div className="card" style={{border:`1px solid ${err.authorized?"rgba(248,113,113,0.3)":"#0F1C2E"}`}}>
              <div className="card-body">
                <div style={{background:"#050810",borderRadius:8,padding:12,marginBottom:12,border:"1px solid #0A1525"}}>
                  <p style={{fontSize:12,color:"#64748B",lineHeight:1.7}}>I authorize <strong style={{color:"#CBD5E1"}}>{CFG.bizName}</strong> to diagnose and repair the device above. I am responsible for data backup and agree to the terms of service.</p>
                </div>
                <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer"}} onClick={()=>set("authorized",!f.authorized)}>
                  <div style={{width:20,height:20,borderRadius:5,border:`2px solid ${f.authorized?AC:"#334155"}`,background:f.authorized?AC:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1,transition:"all 0.2s"}}>{f.authorized&&<span style={{color:"#050810",fontSize:13,fontWeight:700}}>✓</span>}</div>
                  <span style={{fontSize:13,color:"#94A3B8",lineHeight:1.6}}>I agree to the authorization &amp; terms of service.</span>
                </label>
                {err.authorized&&<div className="field-error" style={{marginTop:8}}>{err.authorized}</div>}
              </div>
            </div>
          )}
          <div style={{display:"flex",justifyContent:"space-between",gap:10}}>
            <button className="btn btn-secondary" onClick={()=>{setErr({});setStep(1);}}>← Back</button>
            <button className="btn btn-primary" onClick={()=>{if(validate())setStep(3);}}>Review →</button>
          </div>
        </div>
      )}

      {/* Step 3 */}
      {step===3&&(
        <div style={{display:"flex",flexDirection:"column",gap:14}} className="fu">
          <div className="card">
            <div className="card-header"><div className="card-title">Ticket Summary</div><button className="btn btn-ghost btn-sm" onClick={()=>setStep(2)}>Edit</button></div>
            <div>
              {[["Service",SVCS.find(s=>s.id===svc)?.label],["Name",f.clientName],["Phone",f.phone],f.email&&["Email",f.email],f.company&&["Company",f.company],f.address&&["Address",f.address],f.deviceType&&["Device",`${f.manufacturer} ${f.modelNumber} (${f.deviceType})`],f.serialNumber&&["Serial",f.serialNumber],["Issue",f.issueTitle||f.problemDescription||"—"],f.issueDetail&&["Details",f.issueDetail],["Priority",f.priority],["Contact",f.contactMethod]].filter(Boolean).map(([l,v],i)=>(
                <div key={i} className="detail-row" style={{padding:"8px 20px"}}>
                  <div className="detail-key">{l}</div>
                  <div className="detail-val">{v}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="card">
            <div className="card-header"><div className="card-title">📱 WhatsApp Message Preview</div><span style={{fontSize:11,color:"#475569"}}>Sent on submit</span></div>
            <div className="card-body">
              <div style={{fontSize:11,fontWeight:700,color:AC,textTransform:"uppercase",letterSpacing:"0.07em",marginBottom:8}}>→ Confirmation to You ({f.phone||"your number"})</div>
              <div className="wa-preview"><div className="wa-bubble">{buildCustomerMsg(previewT)}</div></div>
            </div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
            <button className="btn btn-secondary" onClick={()=>setStep(2)}>← Back</button>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <a href={waUrl(f.phone,buildCustomerMsg(previewT))} target="_blank" rel="noreferrer" className="btn btn-wa btn-sm">💬 Preview WA</a>
              <button className="btn btn-primary" onClick={()=>{if(validate())onSubmit({...f,serviceType:svc,photos:photos.map(p=>p.name),loggedBy:"customer"});}} disabled={saving} style={{minWidth:200}}>
                {saving?"⏳ Saving…":"🚀 Submit & Send Confirmations"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<Root/>,document.getElementById("root"));
</script>
